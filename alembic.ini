# Alembic config for core-owned tables only (projects, decisions, state, sessions, audit_log).
# Django-owned tables are migrated by Django. sqlalchemy.url is resolved in env.py
# from CONTEXTKIT_DB_PATH when left empty.

[alembic]
script_location = %(here)s/core/migrations
prepend_sys_path = %(here)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
