# lefthook.yml


pre-push:
  parallel: true
  jobs:

    # Run ruff linter for all Python files
    - run: python3 -m uv run ruff check .
      glob:
        - "*.py"
    
    # core and mcp tests
    - run: python3 -m uv run pytest
      glob:
        - "*.py"
    
    # Run Django tests in the project venv: Django views import core (SQLAlchemy, Alembic)
    - run: cd api && python3 -m uv run --extra backend python manage.py test
      glob:
        - "api/**/*.py"
        - "core/**/*.py"

    