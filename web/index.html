<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply a saved theme before the first paint, so the page never flashes the other one.
      try {
        var theme = localStorage.getItem('ck_theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Decisions, progress, and reasoning that survive new sessions, tool switches, and cleared context."
    />
    <meta property="og:title" content="Project memory for AI coding agents" />
    <meta property="og:description" content="Decisions, progress, and reasoning that survive new sessions, tool switches, and cleared context." />
    <meta property="og:image" content="https://contextkit-lime.vercel.app/og-image.png" />
    <meta property="og:url" content="https://contextkit-lime.vercel.app" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>contextkit: Project memory for AI coding agents</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
